# Cấu hình daily-brief. Không chứa secret.

[telegram]
# Token/chat ID đọc từ các file .env sau (theo thứ tự, file sau không ghi đè biến đã có).
# BRIEF_TELEGRAM_BOT_TOKEN / BRIEF_TELEGRAM_CHAT_ID (nếu có) được ưu tiên hơn TELEGRAM_*.
env_files = [".env", "../Trading-bot/.env", "../stock/.env", "../precious-metals/.env"]
# Chỉ trả lời chat này (chat riêng). Lệnh từ chat khác bị bỏ qua.
poll_timeout_s = 50
# Lệnh cũ hơn số phút này (vd. gửi lúc máy ngủ / bot tắt) bị bỏ qua.
ignore_older_min = 15

[brief]
window_hours = 24          # cửa sổ tin khi chưa có bản trước hoặc dùng /brief full
max_items = 12
summary_chars = 220
dedup_jaccard = 0.5
# số mục tối đa mỗi phần
caps = { vn_politics = 3, vn_economy = 3, world = 3, stock = 2, gold = 1 }

[schedule]
# Tự gửi theo giờ VN. Chỉ chạy khi bot đang chạy (máy thức).
# Lỡ mốc (máy ngủ/bot tắt) -> gửi bù khi bot chạy lại, ghi rõ "gửi bù"; quá skip_after thì bỏ, bản sau bao phủ.
# parts: news (tin, có dòng số liệu tóm tắt) | stock (chỉ gửi khi hôm nay có phiên) | gold (vàng + tỷ giá)
enabled = true
late_after_min = 20   # gửi sau mốc quá số phút này thì ghi "gửi bù"
retry_min = 10        # lỗi (mạng, nguồn) thì thử lại sau số phút này
max_attempts = 3
slots = [
  { name = "morning", label = "sáng", at = "08:15", skip_after = "15:00", parts = ["news", "gold"] },
  { name = "afternoon", label = "chiều", at = "16:30", skip_after = "23:00", parts = ["news", "stock", "gold"] },
]

[site]
# Trang tĩnh site/index.html (tin, BTC/ETH, chứng khoán, vàng bạc). Dựng lại trong tiến trình bot sau các mốc dưới
# (sau bản tin sáng; sau lần quét Stock Intelligence 15:30). Lỡ mốc vì máy ngủ → dựng khi thức, trước mốc kế tiếp.
enabled = true
rebuild_at = ["08:25", "16:45"]
# Dựng xong → đẩy lên nhánh gh-pages của repo stock (public) → GitHub Actions deploy Pages (brief/publish.py).
publish = true
publish_remote = "git@github-charlie:charlie-long-working/stock.git"
publish_branch = "gh-pages"
page_url = "https://charlie-long-working.github.io/stock/"
# Báo cáo nghiên cứu: tab "🔬 Nghiên cứu" nhúng từng trang (iframe), Pages phục vụ ở reports/<key>/.
# src tương đối thư mục daily-brief; thiếu file → tab ghi "chưa có trang", không chặn bản tin. Xem brief/reports.py.
# (Trang phụ không hiện trong tab vẫn khai báo được bằng extra_pages = { "đường/dẫn" = "file.html" }.)

[[site.reports]]
key = "m2-metals-oil"
title = "Cung tiền M2, vàng, bạc, dầu & S&P 500"
date = "2026-11-16"
note = "Tương quan, cực trị, backtest vĩ mô walk-forward · giá đến 13/11/2026, M2 đến 09/2026"
src = "../precious-metals/outputs/m2-metals-oil-20261115/report.html"

[[site.reports]]
key = "gsr-backtest"
title = "Backtest tỷ lệ vàng/bạc (GSR)"
date = "2026-11-11"
note = "Đổi vàng ↔ bạc theo GSR, USD và VND"
src = "../precious-metals/outputs/gsr-backtest-20261111/backtest_report.html"

[[site.reports]]
key = "silver-history"
title = "Lịch sử vàng & bạc 1968–2026"
date = "2026-11-11"
note = "Đỉnh/đáy theo năm và chu kỳ, các nhịp giảm ≥20%"
src = "../precious-metals/outputs/silver-history-20261111/page.html"

[watchlist]
# Tái sử dụng danh sách có sẵn trong repo stock (CHƯA được xác nhận là watchlist chính thức).
file = "../stock/vn_stock/data/screening/watchlist_27_coverage.json"
label = "watchlist_27 từ repo stock (chưa xác nhận)"

[market]
indices = ["VNINDEX", "VN30", "HNXINDEX"]
cache_min = 10

[ai]
# Tóm tắt bản tin bằng Claude Code CLI `claude -p` (tính vào gói Claude của bạn). Xem docs/AI_TOM_TAT.md.
# CLI: tự tìm trên PATH, ~/.local/bin, hoặc bản đi kèm app Claude Desktop. Đăng nhập: CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token`) trong daily-brief/.env. Chưa đăng nhập → bản tin template như cũ, không lỗi.
enabled = true
command = ["claude"]
model = "sonnet"          # "haiku" rẻ hơn nữa nhưng tiếng Việt kém mượt hơn
effort = "low"            # tóm tắt không cần suy luận dài → ít token "thinking"
timeout_s = 300
# Đoạn mở đầu bài báo (sapo + vài đoạn đầu) cho tin ĐÃ CHỌN, mỗi URL tải 1 lần (bảng articles), cắt ≤ article_chars.
fetch_articles = true
article_hosts = ["vnexpress.net", "cafef.vn"]
article_chars = 900
