# VN News Digest: tin Vietstock theo mã + nhận định thị trường → Telegram
# Lịch: T2–T6 7:45 ICT (trước giờ mở cửa) = UTC 0:45 Mon–Fri
#
# Không cần token Vietstock (KBS stockinfo + Google News RSS site:vietstock.vn).
# Sau mỗi lần chạy: commit cache tin đã gửi → lần sau không gửi trùng.
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (dùng chung với VN Hourly)

name: VN News Digest

on:
  schedule:
    - cron: "45 0 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Không gửi Telegram"
        required: false
        default: "false"
      symbols:
        description: "Danh sách mã (trống = watchlist mặc định)"
        required: false
        default: ""
      days:
        description: "Cửa sổ tin theo mã (ngày)"
        required: false
        default: "3"

concurrency:
  group: vn-news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet pandas requests python-dotenv
          # vnstock chỉ dùng cho tin KBS; thiếu thì digest vẫn chạy bằng Google News
          pip install --quiet "vnstock>=3.0.0" || echo "::warning::vnstock không cài được — bỏ nguồn KBS"

      - name: Run news digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Ho_Chi_Minh
          PYTHONPATH: ${{ github.workspace }}
        run: |
          EXTRA="--days ${{ github.event.inputs.days || '3' }}"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ -n "$SYMS" ]; then EXTRA="$EXTRA --symbols $SYMS"; fi
          echo "Run EXTRA=$EXTRA"
          python -W ignore -m vn_stock.scripts.run_vn_news_digest $EXTRA

      - name: Commit sent cache + snapshot
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vn_stock/data/screening/vn_news_sent.json \
                  vn_stock/data/screening/vn_news_snapshot.json || true
          if git diff --staged --quiet; then
            echo "No cache changes."
          else
            git commit -m "chore(data): news digest cache [skip ci]"
            git pull --rebase --autostash
            git push
          fi
