# ĐÃ TẮT (15/11/2026): vnstock bị gỡ khỏi PyPI nên bước pip install lỗi; GitHub đã disable (inactivity).
# Bot hourly chạy bằng launchd trên Mac — xem deploy/README_hourly_vn.md. Giữ file để tham khảo.
#
# VN Hourly: cập nhật nến + tín hiệu → Telegram
# Lịch ICT T2–T6 8:05–14:05 = UTC 1:05–7:05 Mon–Fri
#
# Sau mỗi lần chạy: commit CSV OHLCV (+ snapshot/dedupe) vào chính repo này
# → lần sau checkout đã có data, chỉ fetch incremental.
#
# Secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   TB_CHECKOUT_TOKEN — PAT đọc Trading-bot nếu private
# Variables: TB_REPO (default charlie-long-working/trading-bot)

name: VN Hourly Telegram

on:
  schedule:
    - cron: "5 1-7 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Bỏ qua cửa sổ giờ (force)"
        required: false
        default: "true"
      dry_run:
        description: "Không gửi Telegram"
        required: false
        default: "false"
      heartbeat:
        description: "Gửi heartbeat khi 0 signal"
        required: false
        default: "false"
      symbols:
        description: "Danh sách mã (trống = VN30/default)"
        required: false
        default: ""
      commit_data:
        description: "Commit CSV OHLCV vào repo"
        required: false
        default: "true"

concurrency:
  group: vn-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout stock (this repo)
        uses: actions/checkout@v4
        with:
          path: stock
          # cần history nhẹ + token mặc định để push commit data
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Trading-bot (botdown engines)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TB_REPO || 'charlie-long-working/trading-bot' }}
          token: ${{ secrets.TB_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
          path: Trading-bot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stock/requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r stock/requirements.txt

      - name: Run hourly VN session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Ho_Chi_Minh
          PYTHONPATH: ${{ github.workspace }}/stock:${{ github.workspace }}/Trading-bot
        working-directory: stock
        run: |
          EXTRA=""
          FORCE="${{ github.event.inputs.force || 'false' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          HB="${{ github.event.inputs.heartbeat || 'false' }}"
          SYMS="${{ github.event.inputs.symbols || '' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            EXTRA="$EXTRA --force"
          fi
          if [ "$DRY" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$HB" = "true" ]; then EXTRA="$EXTRA --heartbeat"; fi
          if [ -n "$SYMS" ]; then EXTRA="$EXTRA --symbols $SYMS"; fi
          echo "Run EXTRA=$EXTRA TZ=$TZ"
          python -m vn_stock.scripts.run_hourly_vn_session --delay 3.5 $EXTRA

      - name: Commit OHLCV CSV + snapshot into repo
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.commit_data != 'false') }}
        working-directory: stock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vn_stock/data/ohlcv \
                  vn_stock/data/screening/hourly_vn_snapshot.json \
                  vn_stock/data/screening/hourly_vn_sent.json \
                  vn_stock/data/screening/telegram_sent_cache.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): hourly OHLCV update [skip ci]"
            git push
            echo "Committed and pushed OHLCV CSV."
          fi

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-vn-snapshot
          path: stock/vn_stock/data/screening/hourly_vn_snapshot.json
          if-no-files-found: ignore
          retention-days: 14
